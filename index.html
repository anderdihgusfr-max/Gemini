<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333538; border-radius: 4px; }
    </style>
</head>
<body class="bg-[#131314] text-[#E3E3E3] h-screen flex font-sans overflow-hidden">

    <!-- Left Sidebar -->
    <aside class="w-64 bg-[#1E1F20] flex flex-col justify-between border-r border-[#333538] select-none">
        <div class="p-4 flex flex-col space-y-4">
            <div class="flex items-center space-x-3 px-2">
                <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"/></svg>
                <span class="font-medium text-sm tracking-wide">Gemini</span>
            </div>
            <button onclick="newChat()" class="flex items-center space-x-3 bg-[#2B2D31] hover:bg-[#37393e] text-xs font-medium px-4 py-3 rounded-full transition w-full text-left">
                <span class="text-lg leading-none">+</span>
                <span>New chat</span>
            </button>
            <div class="text-xs text-gray-400 px-2 pt-2">Recent</div>
            <div id="chatHistory" class="space-y-1 overflow-y-auto max-h-[calc(100vh-250px)] text-xs">
                <div class="px-3 py-2 rounded-lg bg-[#282a2c] text-white truncate cursor-pointer">Build Gemini-like Gemma Website</div>
            </div>
        </div>

        <!-- User Profile Footer -->
        <div class="p-4 border-t border-[#333538] flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-full bg-purple-600 flex items-center justify-center font-bold text-white text-xs">GG</div>
                <div class="flex flex-col">
                    <span class="text-xs font-medium text-white">Gusts Grigale</span>
                    <span class="text-[10px] text-gray-400">Latvia</span>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col justify-between relative overflow-hidden">
        
        <!-- Top Nav -->
        <header class="flex justify-between items-center px-6 py-4">
            <span class="text-sm font-medium text-gray-400">Ollama Local Engine Active</span>
            <div class="flex items-center space-x-3">
                <button class="bg-[#1E1F20] hover:bg-[#2B2D31] text-xs px-3 py-1.5 rounded-full border border-[#333538] flex items-center space-x-1.5 transition">
                    <span class="w-2 h-2 rounded-full bg-blue-400"></span>
                    <span>Upgrade</span>
                </button>
            </div>
        </header>

        <!-- Chat Workspace -->
        <div id="workspace" class="flex-1 overflow-y-auto px-4 py-6 space-y-6 max-w-3xl w-full mx-auto flex flex-col justify-center items-center">
            <div id="welcomeScreen" class="text-center space-y-4">
                <h1 class="text-4xl font-semibold bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">What's next, Gusts?</h1>
            </div>
            <div id="chatMessages" class="w-full space-y-6 hidden"></div>
        </div>

        <!-- Input Footer Bar -->
        <footer class="p-6 max-w-3xl w-full mx-auto relative">
            
            <!-- Custom Model Dropdown Popup Menu -->
            <div id="modelDropdown" class="hidden absolute bottom-24 left-6 w-80 bg-[#1E1F20] border border-[#333538] rounded-2xl shadow-2xl p-2 z-50 flex flex-col space-y-1">
                
                <!-- 3.5 Flash-Lite -->
                <div onclick="selectModel('gemma4:e2b', '3.5 Flash-Lite')" class="model-option flex items-center justify-between p-3 rounded-xl hover:bg-[#2B2D31] cursor-pointer transition">
                    <div class="flex flex-col">
                        <span class="text-sm font-medium text-white flex items-center space-x-2">
                            <span>3.5 Flash-Lite</span>
                        </span>
                        <span class="text-xs text-gray-400">Fastest answers</span>
                    </div>
                    <span id="check-gemma4:e2b" class="text-white text-sm">✓</span>
                </div>

                <!-- 3.6 Flash -->
                <div onclick="selectModel('gemma4:e4b', '3.6 Flash')" class="model-option flex items-center justify-between p-3 rounded-xl hover:bg-[#2B2D31] cursor-pointer transition">
                    <div class="flex flex-col">
                        <span class="text-sm font-medium text-gray-300">3.6 Flash</span>
                        <span class="text-xs text-gray-500">Balanced performance</span>
                    </div>
                    <span id="check-gemma4:e4b" class="text-transparent text-sm">✓</span>
                </div>

                <!-- 3.1 Pro -->
                <div onclick="selectModel('gemma4:12b', '3.1 Pro')" class="model-option flex items-center justify-between p-3 rounded-xl hover:bg-[#2B2D31] cursor-pointer transition">
                    <div class="flex flex-col">
                        <span class="text-sm font-medium text-gray-300">3.1 Pro</span>
                        <span class="text-xs text-gray-500">Advanced reasoning</span>
                    </div>
                    <span id="check-gemma4:12b" class="text-transparent text-sm">✓</span>
                </div>

                <div class="border-t border-[#333538] my-1"></div>

                <!-- Extended Thinking Toggle -->
                <div onclick="toggleThinking()" class="flex items-center justify-between p-3 rounded-xl hover:bg-[#2B2D31] cursor-pointer transition">
                    <div class="flex flex-col">
                        <span class="text-sm font-medium text-white">Extended thinking</span>
                        <span class="text-xs text-gray-400">Complex problem solving</span>
                    </div>
                    <span id="thinkingCheck" class="text-white text-sm">✓</span>
                </div>
            </div>

            <!-- Input Box -->
            <div class="bg-[#1E1F20] rounded-3xl px-4 py-3 border border-[#333538] flex items-center justify-between shadow-lg">
                <div class="flex items-center space-x-3 flex-1">
                    <button class="text-gray-400 hover:text-white text-xl font-light px-1 transition">+</button>
                    <textarea id="userInput" rows="1" placeholder="Ask Gemini" class="bg-transparent text-white focus:outline-none resize-none text-sm w-full max-h-32"></textarea>
                </div>

                <div class="flex items-center space-x-3">
                    <!-- Model Selector Trigger Badge -->
                    <button id="modelBadgeBtn" onclick="toggleDropdown(event)" class="flex items-center space-x-1.5 bg-[#2B2D31] hover:bg-[#37393e] text-xs text-gray-300 px-3 py-1.5 rounded-full border border-[#444746] transition cursor-pointer">
                        <span id="currentModelLabel">3.5 Flash-Lite</span>
                        <svg class="w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                    </button>

                    <!-- Mic Button -->
                    <button class="text-gray-400 hover:text-white transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
                    </button>
                </div>
            </div>
        </footer>
    </main>

    <script>
        const workspace = document.getElementById("workspace");
        const welcomeScreen = document.getElementById("welcomeScreen");
        const chatMessages = document.getElementById("chatMessages");
        const userInput = document.getElementById("userInput");
        const modelDropdown = document.getElementById("modelDropdown");
        const currentModelLabel = document.getElementById("currentModelLabel");

        let messages = [];
        let selectedModel = "gemma4:e2b";
        let extendedThinkingEnabled = true;

        function toggleDropdown(e) {
            e.stopPropagation();
            modelDropdown.classList.toggle("hidden");
        }

        window.addEventListener("click", () => {
            if (!modelDropdown.classList.contains("hidden")) {
                modelDropdown.classList.add("hidden");
            }
        });

        function selectModel(modelKey, labelName) {
            selectedModel = modelKey;
            currentModelLabel.textContent = labelName;
            
            // Update checkmarks in popup
            document.querySelectorAll('[id^="check-gemma"]').forEach(el => el.classList.add("text-transparent"));
            document.getElementById(`check-${modelKey}`).classList.remove("text-transparent");
            document.getElementById(`check-${modelKey}`).classList.add("text-white");
        }

        function toggleThinking() {
            extendedThinkingEnabled = !extendedThinkingEnabled;
            const check = document.getElementById("thinkingCheck");
            if (extendedThinkingEnabled) {
                check.classList.remove("text-transparent");
                check.classList.add("text-white");
            } else {
                check.classList.remove("text-white");
                check.classList.add("text-transparent");
            }
        }

        function newChat() {
            messages = [];
            chatMessages.innerHTML = "";
            chatMessages.classList.add("hidden");
            welcomeScreen.classList.remove("hidden");
            workspace.classList.add("justify-center");
        }

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            userInput.value = "";
            
            if (!welcomeScreen.classList.contains("hidden")) {
                welcomeScreen.classList.add("hidden");
                chatMessages.classList.remove("hidden");
                workspace.classList.remove("justify-center");
            }

            let promptText = text;
            if (extendedThinkingEnabled) {
                promptText = "[Extended Thinking Mode Active: Think deeply, analyze edge cases step-by-step before replying] " + text;
            }

            messages.push({ role: "user", content: promptText });
            appendMessage("user", text);

            const botBubble = appendMessage("assistant", "");
            
            try {
                const response = await fetch("http://localhost:11434/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: selectedModel,
                        messages: messages,
                        stream: true
                    })
                });

                if (!response.ok) throw new Error("Failed to connect to local Ollama server.");

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split("\n");

                    for (const line of lines) {
                        if (line.trim() !== "") {
                            const parsed = JSON.parse(line);
                            if (parsed.message && parsed.message.content) {
                                fullText += parsed.message.content;
                                botBubble.innerHTML = marked.parse(fullText);
                                workspace.scrollTop = workspace.scrollHeight;
                            }
                        }
                    }
                }
                messages.push({ role: "assistant", content: fullText });
            } catch (err) {
                botBubble.innerHTML = `<span class="text-red-400">Error: Ensure Ollama is running with CORS enabled (` + err.message + `).</span>`;
            }
        }

        function appendMessage(role, text) {
            const isUser = role === "user";
            const row = document.createElement("div");
            row.className = `flex w-full space-x-4 ${isUser ? "justify-end" : "justify-start"}`;

            const bubble = document.createElement("div");
            bubble.className = `p-4 rounded-2xl max-w-[85%] text-sm leading-relaxed ${isUser ? "bg-[#2B2D31] text-white" : "bg-transparent text-gray-200"}`;
            
            if (text) bubble.innerHTML = marked.parse(text);

            row.appendChild(bubble);
            chatMessages.appendChild(row);
            workspace.scrollTop = workspace.scrollHeight;
            return bubble;
        }

        userInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
    </script>
</body>
</html>
